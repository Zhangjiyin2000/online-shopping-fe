<main class="watchlist-page">
  <h1>Watchlist</h1>

  <p *ngIf="isLoading">Loading orders...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table
    mat-table
    [dataSource]="userWatchlist"
    class="mat-elevation-z8"
    *ngIf="!isLoading && userWatchlist.length > 0"
  >
    <ng-container matColumnDef="productId">
      <th mat-header-cell *matHeaderCellDef>Product ID</th>
      <td mat-cell *matCellDef="let userWatchlist">
        {{ userWatchlist.productId }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let userWatchlist">
        {{ userWatchlist.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let userWatchlist">
        {{ userWatchlist.description }}
      </td>
    </ng-container>

    <ng-container matColumnDef="retailPrice">
      <th mat-header-cell *matHeaderCellDef>Retail Price</th>
      <td mat-cell *matCellDef="let userWatchlist">
        {{ userWatchlist.retailPrice }}
      </td>
    </ng-container>
   
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let userWatchlist">
        <button mat-button color="primary">
          Remove
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="!isLoading && !errorMessage && userWatchlist.length === 0">
    You have no watchlist yet.
  </p>

</main>
