<main class="product-list-page">
  <h1>Product List</h1>

  <p *ngIf="isLoading">Loading orders...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table
    mat-table
    [dataSource]="userProductDetailList"
    class="mat-elevation-z8"
    *ngIf="!isLoading && userProductDetailList.length > 0"
  >
    <ng-container matColumnDef="productId">
      <th mat-header-cell *matHeaderCellDef>Product ID</th>
      <td mat-cell *matCellDef="let userProductDetailList">
        {{ userProductDetailList.productId }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let userProductDetailList">
        {{ userProductDetailList.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let userProductDetailList">
        {{ userProductDetailList.description }}
      </td>
    </ng-container>

    <ng-container matColumnDef="retailPrice">
      <th mat-header-cell *matHeaderCellDef>Retail Price</th>
      <td mat-cell *matCellDef="let userProductDetailList">
        {{ userProductDetailList.retailPrice }}
      </td>
    </ng-container>
   
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let product">
        <button mat-button color="primary">
          Add to Shopping Cart
        </button>

        <button mat-button color="primary" (click)="addWatchlistByProductId(product.productId)">
          Add to Watchlist
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="!isLoading && !errorMessage && userProductDetailList.length === 0">
    You have no product list yet.
  </p>

   
</main>
