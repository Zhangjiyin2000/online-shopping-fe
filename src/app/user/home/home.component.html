<main class="home-page">
  <h1>My Orders</h1>

  <p *ngIf="isLoading">Loading orders...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table
    mat-table
    [dataSource]="orders"
    class="mat-elevation-z8"
    *ngIf="!isLoading && orders.length > 0"
  >
    <ng-container matColumnDef="orderId">
      <th mat-header-cell *matHeaderCellDef>Order ID</th>
      <td mat-cell *matCellDef="let order">
        {{ order.orderId }}
      </td>
    </ng-container>

    <ng-container matColumnDef="datePlaced">
      <th mat-header-cell *matHeaderCellDef>Date Placed</th>
      <td mat-cell *matCellDef="let order">
        {{ order.datePlaced | date: 'medium' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="orderStatus">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let order">
        {{ order.orderStatus }}
      </td>
    </ng-container>

    <ng-container matColumnDef="items">
      <th mat-header-cell *matHeaderCellDef>Items</th>
      <td mat-cell *matCellDef="let order">
        {{ getProductNames(order) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let order">
        {{ getOrderTotal(order) | currency }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let order">
        <a mat-button color="primary" [routerLink]="['/orders', order.orderId]">
          View
        </a>

        <button mat-button color="warn">
          Cancel
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="!isLoading && !errorMessage && orders.length === 0">
    You have no orders yet.
  </p>

  <app-top-items></app-top-items>

</main>
