<section class="admin-stats">
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <mat-card class="stat-card">
    <mat-card-title class="stat-card-title">Most Profitable Items</mat-card-title>
    <mat-card-content>
      <ol class="stat-list">
        <li *ngFor="let product of profitableProducts">
          {{ product.name }} ({{ product.totalProfit | currency }})
        </li>
      </ol>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-title class="stat-card-title">Top 3 Popular Items</mat-card-title>
    <mat-card-content>
      <ol class="stat-list">
        <li *ngFor="let product of poplarProducts">
          {{ product.name }} ({{ product.totalQuantity }} sold)
        </li>
      </ol>
    </mat-card-content>
  </mat-card>

  <app-total-sold-items></app-total-sold-items>

</section>
