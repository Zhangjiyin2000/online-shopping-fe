<main class="product-form-page">
  <section class="product-form-panel">
    <h1>Product Form</h1>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name" autocomplete="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput type="text" formControlName="description">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Wholesale Price</mat-label>
        <input matInput type="number" formControlName="wholesalePrice">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Retail Price</mat-label>
        <input matInput type="number" formControlName="retailPrice">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity">
      </mat-form-field>
     

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
        Submit
      </button>
    </form>
  </section>
</main>
