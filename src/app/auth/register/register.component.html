<main class="auth-page">
  <section class="register-panel">
    <h1>Register</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
      >
      <p class="field-error" *ngIf="registerForm.controls.username.touched && registerForm.controls.username.invalid">
        Username is required.
      </p>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
      >
      <p class="field-error" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.hasError('required')">
        Email is required.
      </p>
      <p class="field-error" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.hasError('email')">
        Enter a valid email address.
      </p>

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      >
      <p class="field-error" *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid">
        Password is required.
      </p>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </section>
</main>
